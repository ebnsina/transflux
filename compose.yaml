name: transflux

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transflux}
      POSTGRES_DB: transflux
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transflux"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-transflux}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-transflux123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: .
    environment:
      TRANSFLUX_ENV: dev
      TRANSFLUX_HTTP_ADDR: ":8080"
      TRANSFLUX_DATABASE_URL: postgres://transflux:${POSTGRES_PASSWORD:-transflux}@postgres:5432/transflux?sslmode=disable
      TRANSFLUX_LOG_LEVEL: debug
      TRANSFLUX_S3_ENDPOINT: http://minio:9000
      TRANSFLUX_S3_REGION: us-east-1
      TRANSFLUX_S3_BUCKET: transflux
      TRANSFLUX_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-transflux}
      TRANSFLUX_S3_SECRET_KEY: ${S3_SECRET_KEY:-transflux123}
      TRANSFLUX_S3_PATH_STYLE: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:

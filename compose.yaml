name: transflux

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transflux}
      POSTGRES_DB: transflux
    ports: ["${TRANSFLUX_PG_PORT:-7432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transflux"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-transflux}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-transflux123}
    ports: ["${TRANSFLUX_S3_PORT:-7900}:9000", "${TRANSFLUX_S3_CONSOLE_PORT:-7901}:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: .
    environment:
      TRANSFLUX_ENV: dev
      TRANSFLUX_HTTP_ADDR: ":8080"
      TRANSFLUX_DATABASE_URL: postgres://transflux:${POSTGRES_PASSWORD:-transflux}@postgres:5432/transflux?sslmode=disable
      TRANSFLUX_LOG_LEVEL: debug
      TRANSFLUX_S3_ENDPOINT: http://minio:9000
      # Presigned URLs are handed to clients outside this network.
      TRANSFLUX_S3_PUBLIC_ENDPOINT: http://localhost:${TRANSFLUX_S3_PORT:-7900}
      # Workers are on this network; customers are not.
      TRANSFLUX_S3_WORKER_ENDPOINT: http://minio:9000
      TRANSFLUX_S3_REGION: us-east-1
      TRANSFLUX_S3_BUCKET: transflux
      TRANSFLUX_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-transflux}
      TRANSFLUX_S3_SECRET_KEY: ${S3_SECRET_KEY:-transflux123}
      TRANSFLUX_S3_PATH_STYLE: "true"
      TRANSFLUX_WORKER_BOOTSTRAP_TOKEN: ${WORKER_BOOTSTRAP_TOKEN:-dev-worker-bootstrap}
      TRANSFLUX_LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-15}
    ports: ["${TRANSFLUX_HTTP_PORT:-7080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  # A real worker, running the pinned FFmpeg build rather than whatever is
  # installed on the developer's machine.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      TRANSFLUX_CONTROL_PLANE_URL: http://control-plane:8080
      TRANSFLUX_WORKER_BOOTSTRAP_TOKEN: ${WORKER_BOOTSTRAP_TOKEN:-dev-worker-bootstrap}
      TRANSFLUX_WORKER_NAME: ${TRANSFLUX_WORKER_NAME:-worker-1}
      TRANSFLUX_WORKER_DIR: /var/lib/transflux
    depends_on:
      control-plane: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:

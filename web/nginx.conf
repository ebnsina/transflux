server {
    listen 80;

    # Uploads go straight to storage, but they pass through here on their way
    # so the browser stays on one origin. Media is large.
    client_max_body_size 0;

    location /v1/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://control-plane:8080;
    }

    # Storage is deliberately not proxied here. SigV4 signs the request path,
    # so stripping a prefix on the way through would invalidate every presigned
    # URL. The browser uploads to storage directly, which is also the path a
    # customer's own client takes.

    location / {
        root /usr/share/nginx/html;
        # A single-page app: every unknown path is a client-side route, so the
        # fallback has to answer rather than 404.
        try_files $uri /200.html;
    }
}
